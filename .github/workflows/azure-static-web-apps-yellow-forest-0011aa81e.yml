name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - trunk
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - trunk
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
    branches:
      - trunk

jobs:
  build_and_deploy_job:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.action != 'closed' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_FOREST_0011AA81E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match you app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/aeons-end" # App source code path
          api_location: "api" # Api source code path - optional
          app_artifact_location: "dist/browser" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.actor != 'dependabot[bot]') ||
      (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.actor == 'dependabot[bot]')
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_FOREST_0011AA81E }}
          action: "close"
