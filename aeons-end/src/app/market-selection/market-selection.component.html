@if (cards) {
  <h2>Player cards</h2>
}
@if (cards && expeditionMode) {
  <p>Add these player cards to your Barracks.</p>
}
<div class="row">
  @for (card of cards; track card) {
    <div class="border col-4 {{ getCardCssClass(card.type) }}">
      <div class="card-cost">
        {{ card.cost }}
      </div>
      <div class="card-name">
        {{ card.name }}
      </div>
      <div class="card-type">
        {{ getCardTypeLabel(card.type) }}
      </div>
    </div>
  }
</div>
