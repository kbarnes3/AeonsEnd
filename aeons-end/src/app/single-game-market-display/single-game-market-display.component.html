<app-market-selection></app-market-selection>
<h2>Nemesis setup</h2>
<div class="table-surface">
  <table mat-table [dataSource]="nemesisDeck" class="nemesis-table">
    <ng-container matColumnDef="cards">
      <th mat-header-cell *matHeaderCellDef>Basic Nemesis Cards</th>
      <td mat-cell *matCellDef="let row">{{ row.cards }}</td>
    </ng-container>

    <ng-container matColumnDef="p1">
      <th mat-header-cell *matHeaderCellDef class="numeric-col">1 Player</th>
      <td mat-cell *matCellDef="let row" class="numeric-col">{{ row.p1 }}</td>
    </ng-container>

    <ng-container matColumnDef="p2">
      <th mat-header-cell *matHeaderCellDef class="numeric-col">2 Players</th>
      <td mat-cell *matCellDef="let row" class="numeric-col">{{ row.p2 }}</td>
    </ng-container>

    <ng-container matColumnDef="p3">
      <th mat-header-cell *matHeaderCellDef class="numeric-col">3 Players</th>
      <td mat-cell *matCellDef="let row" class="numeric-col">{{ row.p3 }}</td>
    </ng-container>

    <ng-container matColumnDef="p4">
      <th mat-header-cell *matHeaderCellDef class="numeric-col">4 Players</th>
      <td mat-cell *matCellDef="let row" class="numeric-col">{{ row.p4 }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
